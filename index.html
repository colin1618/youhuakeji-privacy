<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="有话可记官方隐私政策与技术支持页面。">
  <title>有话可记 · 支持与隐私</title>
  <style>
    :root { color-scheme: light dark; --brand: #3D61D9; --ink: #202433; --muted: #697080; --paper: #f7f8fb; --card: #fff; --line: #e7e9ef; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f1f2f5; --muted: #aeb3c0; --paper: #13151a; --card: #1c1f26; --line: #30343e; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 52px auto; }
    header { text-align: center; margin-bottom: 32px; }
    .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 17px; color: white; background: var(--brand); font-size: 25px; font-weight: 650; }
    h1 { margin: 12px 0 4px; font-size: clamp(26px, 5vw, 34px); line-height: 1.25; letter-spacing: -.03em; }
    header p, .muted { color: var(--muted); }
    header p { margin: 0; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 22px 0 32px; }
    nav a { padding: 9px 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--brand); text-decoration: none; font-weight: 600; }
    section { margin: 16px 0; padding: 24px clamp(18px, 5vw, 32px); border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
    h2 { margin: 0 0 10px; font-size: 21px; }
    p { margin: 10px 0; }
    a { color: var(--brand); }
    footer { margin: 28px 0; color: var(--muted); text-align: center; font-size: 14px; }
    .lang { margin-top: 38px; padding-top: 28px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">记</div>
      <h1>有话可记</h1>
      <p>一款原生系统级文字日记本</p>
    </header>
    <nav aria-label="页面导航">
      <a href="privacy.html">隐私政策</a>
      <a href="support.html">技术支持</a>
    </nav>
    <section>
      <h2>关于有话可记</h2>
      <p>没有繁杂功能，只专注安放你的心里话、感想与日常。你可以在 Mac 上沉浸书写、回看与复盘，在 iPhone 上随手捕捉转瞬的思绪。</p>
      <p>日记默认保存在设备上。你可以选择开启 iCloud 同步，在自己的 Apple 设备间同步文字。</p>
    </section>
    <section>
      <h2>需要帮助？</h2>
      <p>常见问题和联系方法请查看<a href="support.html">技术支持页面</a>。也可以发送邮件至 <a href="mailto:hi@55lab.top">hi@55lab.top</a>。</p>
    </section>
    <section>
      <h2>隐私</h2>
      <p>了解日记存储、iCloud 同步、位置与天气处理方式，请阅读<a href="privacy.html">隐私政策</a>。</p>
    </section>
    <footer>© 2026 5.5 LAB · 有话可记</footer>
  </main>
</body>
</html>
